<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outcome Points Preview</title>
  <style>
    body {
      background: #1a1a2e;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    .kc-outcome-wrapper {
      font-family: 'DM Sans', sans-serif;
      background: transparent;
      padding: 10px 0 40px 0;
      width: 100%;
      max-width: 900px;
    }

    .kc-outcome-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .kc-outcome-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      width: 100%;
    }

    .kc-outcome-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kc-outcome-check {
      width: 24px;
      height: 24px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kc-outcome-check svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .kc-outcome-text {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.5;
      margin: 0;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .kc-outcome-text {
        white-space: normal;
      }
      .kc-outcome-row {
        gap: 24px;
      }
    }

    @media (max-width: 600px) {
      .kc-outcome-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="kc-outcome-wrapper">
  <div class="kc-outcome-grid">

    <!-- Row 1: 3 items -->
    <div class="kc-outcome-row">
      <div class="kc-outcome-item">
        <div class="kc-outcome-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="kc-outcome-text">Less time chasing updates</p>
      </div>
      <div class="kc-outcome-item">
        <div class="kc-outcome-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="kc-outcome-text">Fewer bottlenecks and surprises</p>
      </div>
      <div class="kc-outcome-item">
        <div class="kc-outcome-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="kc-outcome-text">Better team visibility and accountability</p>
      </div>
    </div>

    <!-- Row 2: 2 items centred -->
    <div class="kc-outcome-row">
      <div class="kc-outcome-item">
        <div class="kc-outcome-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="kc-outcome-text">More confidence in deadlines, workload and planning</p>
      </div>
      <div class="kc-outcome-item">
        <div class="kc-outcome-check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="kc-outcome-text">A workflow system that can scale with firm complexity</p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
