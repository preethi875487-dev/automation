<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outcome Points Preview</title>
  <style>
    body {
      background: #1a1a2e;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    .kc-outcome-wrapper {
      font-family: 'DM Sans', sans-serif;
      background: transparent;
      padding: 10px 0 40px 0;
      width: 100%;
      max-width: 900px;
    }

    /* 6-column grid: row1 items span 2 cols each (1-2, 3-4, 5-6);
       row2 items span 2 cols offset by 1 (2-3, 4-5) → perfectly centred */
    .kc-outcome-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      row-gap: 24px;
      column-gap: 16px;
      width: 100%;
    }

    .kc-outcome-item {
      display: flex;
      align-items: center;
      gap: 10px;
      grid-column: span 2;
    }

    /* Row 2: shift right by one column to centre under row 1 */
    .kc-outcome-item:nth-child(4) { grid-column: 2 / 4; }
    .kc-outcome-item:nth-child(5) { grid-column: 4 / 6; }

    .kc-outcome-check {
      width: 24px;
      height: 24px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kc-outcome-check svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .kc-outcome-text {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.5;
      margin: 0;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .kc-outcome-text { white-space: normal; }
      .kc-outcome-grid { grid-template-columns: 1fr; row-gap: 14px; }
      .kc-outcome-item,
      .kc-outcome-item:nth-child(4),
      .kc-outcome-item:nth-child(5) { grid-column: 1 / -1; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="kc-outcome-wrapper">
  <div class="kc-outcome-grid">

    <div class="kc-outcome-item">
      <div class="kc-outcome-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <p class="kc-outcome-text">Less time chasing updates</p>
    </div>
    <div class="kc-outcome-item">
      <div class="kc-outcome-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <p class="kc-outcome-text">Fewer bottlenecks and surprises</p>
    </div>
    <div class="kc-outcome-item">
      <div class="kc-outcome-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <p class="kc-outcome-text">Better team visibility and accountability</p>
    </div>
    <div class="kc-outcome-item">
      <div class="kc-outcome-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <p class="kc-outcome-text">More confidence in deadlines, workload and planning</p>
    </div>
    <div class="kc-outcome-item">
      <div class="kc-outcome-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <p class="kc-outcome-text">A workflow system that can scale with firm complexity</p>
    </div>

  </div>
</div>

</body>
</html>
